[project]
name = "lang-graph"
version = "0.1.0"
description = "LangGraph Agent Network with MCP Integration"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.4.0",
    "langchain>=0.3.0",
    "langchain-openai>=0.3.0",
    "langchain-ollama>=0.3.0",
    "langchain-core>=0.3.0",
    "python-dotenv>=1.1.0",
    "httpx>=0.28.0",
    "pydantic>=2.10.0",
]

[project.scripts]
start = "src.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
